[Settings]
; Target display refresh rate in Hz (e.g. 60, 75, 120, 144, 165, 240, 360)
; Sets Unity's Time.fixedDeltaTime = 1 / TargetHz to eliminate camera judder & ghosting
TargetHz=165

; Maximum physics simulation steps Unity is allowed to run in a single rendered frame
; Default: 2 (range: 1 to 4)
; Hard-limits physics catch-up to prevent the Unity "Delta Time Death Spiral" (e.g. dropping to 9 FPS)
MaxPhysicsStepsPerFrame=2

; Uncap Unity target frame rate (-1 disables Unity engine frame cap)
; 1 = Uncapped (recommended), 0 = Game default
UncapFramerate=1

; Enable diagnostic logging to BeneathDeltaTimeFix.log
; 1 = Enabled, 0 = Disabled
Logging=1
