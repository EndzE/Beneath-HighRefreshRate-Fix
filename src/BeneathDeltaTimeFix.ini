[Settings]
; Target display refresh rate in Hz (e.g. 60, 75, 120, 144, 165, 240, 360)
; The mod sets Unity's Time.fixedDeltaTime = 1 / TargetHz to eliminate camera judder & ghosting
TargetHz=165

; Uncap Unity target frame rate (-1 disables Unity engine frame cap)
; 1 = Uncapped (recommended), 0 = Game default
UncapFramerate=1

; Enable diagnostic logging to BeneathDeltaTimeFix.log
; 1 = Enabled, 0 = Disabled
Logging=1
